<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Internship Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <img src="assets/logo.png" alt="Logo" class="logo">
    <h1>Smart Internship Finder</h1>
    <p>Find internships based on your skills</p>
</header>

<div class="container">

    <h2>Enter Your Skills</h2>

    <input type="text" id="skillsInput"
        placeholder="Example: Python, SQL, React">

    <button onclick="findInternships()">
        Find Internships
    </button>

    <div id="results"></div>

</div>

<script src="script.js"></script>

</body>
</html>
